    <text x="264" y="438">Неделя 2</text>
    <text x="431" y="438">Неделя 3</text>
    <text x="597" y="438">Неделя 4</text>
    <text x="763" y="438">Неделя 5</text>
    <text x="398" y="463" font-weight="700">Неделя программы</text>
