    <circle cx="124" cy="410" r="4.5"/>
    <circle cx="290" cy="362" r="4.5"/>
    <circle cx="456" cy="312" r="4.5"/>
    <circle cx="623" cy="266" r="4.5"/>
    <circle cx="790" cy="216" r="4.5"/>
