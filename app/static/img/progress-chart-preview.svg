  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    <circle cx="560" cy="170" r="6" fill="#fff" stroke="#13899a" stroke-width="3"/>
    <text x="572" y="175" fill="#34485d">Фактический вес</text>
    <circle cx="704" cy="170" r="6" fill="#fff" stroke="#ff8a5b" stroke-width="3"/>
