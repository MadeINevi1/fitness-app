  </g>

  <path d="M124 410 L290 340 L456 312 L623 270 L790 200 L790 410 Z" fill="url(#lineFill)"/>
  <path d="M124 410 C180 386 232 355 290 340 C348 324 396 321 456 312 C520 301 566 286 623 270 C684 250 734 226 790 200" fill="none" stroke="#13899a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M124 410 C180 392 236 372 290 362 C350 342 402 324 456 312 C516 298 566 278 623 266 C682 246 734 228 790 216" fill="none" stroke="#ff8a5b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 7"/>

